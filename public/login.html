<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MiniLoja - Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <div class="logo" onclick="window.location.href='index.html'">MiniLoja</div>
    </nav>
  </header>

  <main class="form-container">
    <div class="form-card">
      <h2>Entrar</h2>
      <form id="form-login">
  <label for="email">Email</label>
  <input type="email" id="email" required>

  <label for="senha">Senha</label>
<div class="campo-senha">
  <input type="password" id="senha" required>
  <button type="button" class="btn-olho" data-alvo="senha">👁</button>
</div>

  <button type="submit" class="btn-primario">Entrar</button>
</form>
<p id="mensagem-erro" class="mensagem-erro"></p>
<p class="link-secundario">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
<p class="link-secundario"><a href="esqueci-senha.html">Esqueceu a senha?</a></p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/olho-senha.js"></script>
 
</body>
</html>
