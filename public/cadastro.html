<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MiniLoja - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <div class="logo" onclick="window.location.href='index.html'">MiniLoja</div>
    </nav>
  </header>

  <main class="form-container">
    <div class="form-card">
      <h2>Criar conta</h2>
      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="senha">Senha</label>
        <div class="campo-senha">
        <input type="password" id="senha" required>
        <button type="button" class="btn-olho" data-alvo="senha">👁</button>
</div>

        <button type="submit" class="btn-primario">Cadastrar</button>
      </form>
      <p id="mensagem-erro" class="mensagem-erro"></p>
      <p class="link-secundario">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="js/cadastro.js"></script>
  <script src="js/olho-senha.js"></script>
</body>
</html>
