<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>MiniLoja - Esqueci minha senha</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <div class="logo" onclick="window.location.href='index.html'">MiniLoja</div>
    </nav>
  </header>

  <main class="form-container">
    <div class="form-card">
      <h2>Esqueci minha senha</h2>
      <form id="form-esqueci-senha">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="senha">Senha</label>
   <div class="campo-senha">
     <input type="password" id="senha" required>
     <button type="button" class="btn-olho" data-alvo="senha">👁</button>
     </div>

        <button type="submit" class="btn-primario">Atualizar senha</button>
      </form>
      <p id="mensagem-erro" class="mensagem-erro"></p>
      <p id="mensagem-sucesso" class="mensagem-sucesso"></p>
      <p class="link-secundario"><a href="login.html">Voltar para o login</a></p>
    </div>
  </main>

  <script src="js/esqueci-senha.js"></script>
  <script src="js/olho-senha.js"></script>
</body>
</html>
